# One-click deploy on Render's free tier: Blueprint -> New Blueprint Instance.
# Set GROQ_API_KEY (or any OpenAI-compatible key) when prompted.
databases:
  - name: hackhunt-db
    plan: free
    databaseName: hackhunt
    user: hackhunt

services:
  - type: web
    name: hackhunt
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && NITRO_PRESET=render_com pnpm build
    startCommand: pnpm migrate:production && node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: hackhunt-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # LLM: Groq via its OpenAI-compatible endpoint (free tier)
      - key: AGENT_ENGINE
        value: ai-sdk:openai
      - key: AGENT_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_API_KEY
        sync: false
